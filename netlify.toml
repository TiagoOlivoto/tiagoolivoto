[build]
  publish = "public"
  command = "hugo"

[build.environment]
  # This is a fallback for any context not specifically defined below
  NODE_VERSION = "18"

[context.production.environment]
  NODE_VERSION = "18"
  HUGO_VERSION = "0.74.2"
  HUGO_ENV = "production"
  HUGO_ENABLEGITINFO = "true"

[context.branch-deploy.environment]
  NODE_VERSION = "18"
  HUGO_VERSION = "0.74.2"

[context.deploy-preview.environment]
  NODE_VERSION = "18"
  HUGO_VERSION = "0.74.2"